# Quarkus 3.33 = current LTS (supported until Mar 2027). Check the exact latest
# micro at https://quarkus.io/releases/ when upgrading.
quarkusPluginVersion=3.33.3.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.33.3.1

# Kotlin: keep roughly in sync with the version the Quarkus BOM manages
# (build will warn if the stdlib and compiler drift too far apart).
kotlinVersion=2.2.20

# jOOQ OSS edition (free with open-source DBs incl. Postgres).
# Check latest 3.20.x at https://www.jooq.org/download/versions
jooqVersion=3.20.5

org.gradle.caching=true
org.gradle.parallel=true
