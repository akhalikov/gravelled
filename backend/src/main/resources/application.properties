# --- Datasource: home-server Postgres (ADR 0003) ---------------------------
# Env vars override the defaults; keep real credentials in a git-ignored .env
# (same rule as pipeline/ and infra/ — commit only *.env.example).
quarkus.datasource.db-kind=postgresql
#quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://192.168.1.9:5432/gravelled}
#quarkus.datasource.username=${DB_USER:gravelled}
#quarkus.datasource.password=${DB_PASSWORD:}

# --- Flyway ------------------------------------------------------------------
# Migrations live in src/main/resources/db/migration (V1__*.sql, V2__*.sql ...).
# baseline-on-migrate: the database already contains the v1 (pipeline-created)
# tables; baselining lets Flyway adopt it without demanding an empty schema.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration

# --- Dev conveniences ----------------------------------------------------------
# In dev mode (./gradlew quarkusDev) with no reachable DB you can temporarily
# let Dev Services spin up a throwaway Postgres container by commenting the
# jdbc.url above out — Quarkus does this automatically when no URL is set.
%dev.quarkus.log.category."org.flywaydb".level=DEBUG

# pin the Dev Services Postgres to a fixed port so jooqCodegen can reach it
%dev.quarkus.datasource.devservices.port=5433
